services:
  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - application
      - caddy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: "3001"
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in deploy/.env}
      REDIS_NAMESPACE: ${REDIS_NAMESPACE:-emulator-hub:v1}
    volumes:
      - emulator-hub-data:/app/apps/backend/data
      - ./deploy/roms:/app/apps/backend/roms:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/games').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - application
      - redis
    restart: unless-stopped

volumes:
  emulator-hub-data:
    name: ${EMULATOR_HUB_DATA_VOLUME:-emulator-hub-data}

networks:
  application:
  caddy:
    name: ${CADDY_NETWORK:?Set CADDY_NETWORK in deploy/.env}
    external: true
  redis:
    name: ${REDIS_NETWORK:?Set REDIS_NETWORK in deploy/.env}
    external: true
