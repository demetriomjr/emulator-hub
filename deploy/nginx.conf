js_engine qjs;
js_import frontend_events from /opt/emulator-hub/apps/frontend/server/frontend-events-nginx.mjs;
js_var $frontend_event "";
log_format frontend_event escape=none '$frontend_event';
limit_req_zone $binary_remote_addr zone=frontend_events:1m rate=30r/s;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  location = /_frontend/events {
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    limit_req zone=frontend_events burst=60 nodelay;
    limit_req_status 429;
    access_log /dev/stdout frontend_event if=$frontend_event;
    js_content frontend_events.receive;
  }

  location = /player.html {
    add_header Document-Isolation-Policy "isolate-and-require-corp" always;
    try_files /player.html =404;
  }

  location /api/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /roms/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
