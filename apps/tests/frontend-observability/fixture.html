<html><head><meta charset="utf-8"><title>Frontend RNG E2E</title></head>
<body><div id="game" style="width:320px;height:240px"></div>
<script type="module">
import { createRngResetObserver } from '/apps/packages/rng-reset-observer.mjs'

import { createClientDiagnostics } from '/apps/packages/client-diagnostics.mjs'

import { findGen3EncounterLayout } from '/apps/packages/pokemon-gen3-encounter.mjs'
const parameters = new URLSearchParams(location.search)
const patched = parameters.get('patched') !== '0'
const sessionId = parameters.get('session') ?? crypto.randomUUID()

const observer = createRngResetObserver({ getManager: () => window.EJS_emulator?.gameManager, getDescriptor: () => descriptor, emit: event => {
